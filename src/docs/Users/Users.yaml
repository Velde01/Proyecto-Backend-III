paths:
  /api/users:
    get:
      summary: Obtiene la lista completa de usuarios
      tags:
        - Users
      responses:
        "200":
          description: Lista de usuarios obtenida exitosamente de la base de datos
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        "500":
          description: Error interno del servidor al consultar la base de datos
  /api/users/{uid}:
    get:
      summary: Obtiene un usuario específico por su ID
      tags:
        - Users
      parameters:
        - name: uid
          in: path
          required: true
          description: ID único de MongoDB del usuario
          schema:
            type: string
      responses:
        "200":
          description: Usuario encontrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "404":
          description: Usuario no encontrado
        "500":
          description: Error interno del servidor
    put:
      summary: Actualiza los datos de un usuario por su ID
      tags:
        - Users
      parameters:
        - name: uid
          in: path
          required: true
          description: ID único de MongoDB del usuario a actualizar
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/requestBodies/UpdateUser'
      responses:
        "200":
          description: Usuario actualizado correctamente
        "400":
          description: Datos inválidos en la petición
        "404":
          description: Usuario no encontrado
        "500":
          description: Error interno del servidor
    delete:
      summary: Elimina un usuario por su ID
      tags:
        - Users
      parameters:
        - name: uid
          in: path
          required: true
          description: ID único de MongoDB del usuario a eliminar
          schema:
            type: string
      responses:
        "200":
          description: Usuario eliminado correctamente
        "404":
          description: Usuario no encontrado
        "500":
          description: Error interno del servidor

components:
  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
          description: ID autogenerado por MongoDB
        first_name:
          type: string
          description: Nombre del usuario
        last_name:
          type: string
          description: Apellido del usuario
        email:
          type: string
          description: Correo electrónico único del usuario
        age:
          type: number
          description: Edad del usuario
        password:
          type: string
          description: Contraseña encriptada con bcrypt
        cart:
          type: string
          description: ID de referencia al carrito del usuario
        role:
          type: string
          description: Rol asignado al usuario (por defecto 'user')
      example:
        _id: 66f82a9b3c1234567890abcd
        first_name: Mateo
        last_name: Bentos
        email: mateo@test.com
        age: 25
        password: $2b$10$hashedpasswordexample
        cart: 66f82a9b3c1234567890abce
        role: user
  requestBodies:
    UpdateUser:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        age:
          type: number
        role:
          type: string
      example:
        first_name: Mateo
        last_name: Bentos
        age: 26
        role: admin