paths:
  /api/users:
    get:
      summary: Obtiene la lista completa de usuarios
      tags:
        - Users
      responses:
        "200":
          description: Lista de usuarios obtenida exitosamente de la base de datos
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    _id:
                      type: string
                      description: ID autogenerado por MongoDB
                    first_name:
                      type: string
                    email:
                      type: string
                    role:
                      type: string